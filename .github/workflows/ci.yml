name: check

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run check
      # 꾸러미 보안 경고: 실제로 돌리는 꾸러미만, 높음 이상이면 실패 (보통은 알림만)
      - name: 꾸러미 보안 검사
        run: npm audit --omit=dev --audit-level=high
      # 저장소 기록 전체를 훑는다. 첫 올리기에서도 돌도록 액션 대신 공식 이미지를 직접 쓴다.
      - name: 비밀 키 검사
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 git /repo --redact --verbose

  e2e:
    # 브라우저 흐름 시험: 구운 판을 새 빈 자료로 켜고 실제 브라우저로 눌러 본다
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
      - name: 캡처와 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-out
          path: test/e2e/out/
          retention-days: 14

  windows:
    # 윈도우 상시 서버: 실제 윈도우에서 배포해 작업 스케줄러에 올리고,
    # 죽였다 다시 켜지는지, 매일 백업, 다시 배포, 되돌리기, 되살리기, 해제까지 본다 (scripts/windows/ci-verify.ps1)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - name: 배포 (관리자 PowerShell, 작업 스케줄러 등록)
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\deploy.ps1
      - name: 상시 서버 확인
        shell: powershell
        run: powershell -NoProfile -ExecutionPolicy Bypass -File scripts\windows\ci-verify.ps1
      - name: 기록 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-logs
          path: ~\AppData\Local\naeil\logs\
          retention-days: 14
