openapi: 3.1.0
info:
  title: naeil API
  version: 0.1.0-draft
  summary: 내 일은 naeil에서
  description: |
    내일은내일(naeil) 할 일 API 명세서 초안 (검토용, 코드는 아직 없음).

    - 주소 앞에 버전 `/v1`
    - 시간은 전부 세계 표준시 ISO 8601 (`2026-10-25T05:00:00.000Z`)
    - 지우기는 휴지통으로 (`DELETE` = 휴지통, 되살리기 따로)
    - 오류는 한 가지 모양 (`application/problem+json`)
    - 「결정 필요」라고 적힌 곳은 작가가 고른 뒤 확정
  license:
    name: MIT
    identifier: MIT
servers:
  - url: http://127.0.0.1:3700
    description: 내 맥 (기본은 이 컴퓨터 안에서만)
security:
  - naeilKey: []
tags:
  - name: projects
    description: 프로젝트 (게임·앱 같은 큰 묶음)
  - name: milestones
    description: 마일스톤 (프로젝트 안의 목표 지점)
  - name: tasks
    description: 할 일
  - name: changes
    description: 변경 기록 (읽기만)
  - name: system
    description: 상태 확인

paths:
  /health:
    get:
      tags: [system]
      operationId: getHealth
      summary: 상태 확인
      description: 버전 없이 둔다. 자동 재시작·알림이 이 주소만 본다. 로그인 없이 열린다.
      security: []
      responses:
        "200":
          description: 살아 있음
          content:
            application/json:
              schema:
                type: object
                required: [ok]
                properties:
                  ok: { type: boolean, const: true }

  /v1/projects:
    get:
      tags: [projects]
      operationId: listProjects
      summary: 프로젝트 목록
      parameters:
        - $ref: "#/components/parameters/IncludeTrashed"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [projects]
      operationId: createProject
      summary: 프로젝트 만들기
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "201":
          description: 만들어짐
          headers:
            Location: { schema: { type: string }, description: 새 프로젝트 주소 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }

  /v1/projects/{projectId}:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [projects]
      operationId: getProject
      summary: 프로젝트 하나
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 프로젝트
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [projects]
      operationId: updateProject
      summary: 프로젝트 이름 바꾸기
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 바뀐 프로젝트
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Project" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
    delete:
      tags: [projects]
      operationId: trashProject
      summary: 프로젝트 휴지통으로
      parameters:
        - $ref: "#/components/parameters/Actor"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "204": { description: 휴지통으로 감 }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/projects/{projectId}/milestones:
    parameters:
      - $ref: "#/components/parameters/ProjectId"
    get:
      tags: [milestones]
      operationId: listMilestones
      summary: 프로젝트의 마일스톤 목록
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 목록 (마감 빠른 순)
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Milestone" }
        "404": { $ref: "#/components/responses/NotFound" }
    post:
      tags: [milestones]
      operationId: createMilestone
      summary: 마일스톤 만들기
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name]
              additionalProperties: false
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                dueAt: { type: [string, "null"], format: date-time }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "201":
          description: 만들어짐
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/milestones/{milestoneId}:
    parameters:
      - $ref: "#/components/parameters/MilestoneId"
    patch:
      tags: [milestones]
      operationId: updateMilestone
      summary: 마일스톤 고치기 (이름·마감)
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              minProperties: 1
              properties:
                name: { type: string, minLength: 1, maxLength: 100 }
                dueAt: { type: [string, "null"], format: date-time }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 바뀐 마일스톤
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Milestone" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
    delete:
      tags: [milestones]
      operationId: trashMilestone
      summary: 마일스톤 휴지통으로
      parameters:
        - $ref: "#/components/parameters/Actor"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "204": { description: 휴지통으로 감 }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tasks:
    get:
      tags: [tasks]
      operationId: listTasks
      summary: 할 일 목록 (거르기 가능)
      parameters:
        - name: projectId
          in: query
          schema: { type: string, format: uuid }
        - name: milestoneId
          in: query
          schema: { type: string, format: uuid }
        - name: status
          in: query
          schema: { $ref: "#/components/schemas/Status" }
        - name: blockedReason
          in: query
          description: 「내가 정할 것」 칸은 `blockedReason=my_decision`
          schema: { $ref: "#/components/schemas/BlockedReason" }
        - $ref: "#/components/parameters/IncludeTrashed"
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 목록
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TaskPage" }
        "400": { $ref: "#/components/responses/BadRequest" }
    post:
      tags: [tasks]
      operationId: createTask
      summary: 할 일 만들기
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskCreate" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "201":
          description: 만들어짐
          headers:
            Location: { schema: { type: string }, description: 새 할 일 주소 }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409":
          description: 같은 출처의 같은 이슈가 이미 있음 (두 번 가져오기)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }

  /v1/tasks/{taskId}:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    get:
      tags: [tasks]
      operationId: getTask
      summary: 할 일 하나
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 할 일
          headers:
            ETag: { $ref: "#/components/headers/ETag" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
    patch:
      tags: [tasks]
      operationId: updateTask
      summary: 할 일 고치기 (제목·마감·마일스톤·진행 상태)
      description: 멈춤은 여기서 바꾸지 않고 `/block` 으로. 끝내면(status=done) 멈춘 이유·잡은 세션이 자동으로 지워진다.
      parameters:
        - $ref: "#/components/parameters/Actor"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TaskUpdate" }
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 바뀐 할 일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "412": { $ref: "#/components/responses/PreconditionFailed" }
    delete:
      tags: [tasks]
      operationId: trashTask
      summary: 할 일 휴지통으로
      parameters:
        - $ref: "#/components/parameters/Actor"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "204": { description: 휴지통으로 감 }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tasks/{taskId}/block:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    put:
      tags: [tasks]
      operationId: blockTask
      summary: 멈춤 걸기 (멈춘 이유 + 잡은 세션)
      parameters:
        - $ref: "#/components/parameters/Actor"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              additionalProperties: false
              properties:
                reason: { $ref: "#/components/schemas/BlockedReason" }
                heldBy:
                  type: string
                  description: 「AI가 하는 중」(ai_working)일 때만. 예 claude, codex
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 멈춘 할 일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }
        "422":
          description: 규칙 위반 (끝난 일에 멈춤, ai_working 이 아닌데 잡은 세션)
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
    delete:
      tags: [tasks]
      operationId: unblockTask
      summary: 멈춤 풀기
      parameters:
        - $ref: "#/components/parameters/Actor"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 풀린 할 일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/tasks/{taskId}/revive:
    parameters:
      - $ref: "#/components/parameters/TaskId"
    post:
      tags: [tasks]
      operationId: reviveTask
      summary: 되살리기 (휴지통에서 꺼내거나, 끝난 일을 다시 할 일로)
      parameters:
        - $ref: "#/components/parameters/Actor"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 되살린 할 일
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Task" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/changes:
    get:
      tags: [changes]
      operationId: listChanges
      summary: 변경 기록 (최신 먼저, 읽기만)
      description: 「마지막에 한 일」 칸의 재료. 고치거나 지우는 주소는 없다.
      parameters:
        - name: actor
          in: query
          description: 누가 바꾼 것만 (예 claude)
          schema: { type: string }
        - $ref: "#/components/parameters/Limit"
        - $ref: "#/components/parameters/Cursor"
      responses:
        "401": { $ref: "#/components/responses/Unauthorized" }
        "200":
          description: 기록 목록
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: { $ref: "#/components/schemas/Change" }
                  nextCursor: { type: [string, "null"] }
        "400": { $ref: "#/components/responses/BadRequest" }

components:
  securitySchemes:
    naeilKey:
      type: http
      scheme: bearer
      description: |
        단계 2-4 「나 혼자용 비밀 키」. `Authorization: Bearer <키>`.
        키는 코드에 박지 않고 서버 설정 파일(.env)에 둔다. 만료·교체가 되게.
        단계 1(내 맥 안에서만 열림)에서는 서버가 검사를 꺼 둘 수 있다.
  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      schema: { type: string, format: uuid }
    MilestoneId:
      name: milestoneId
      in: path
      required: true
      schema: { type: string, format: uuid }
    TaskId:
      name: taskId
      in: path
      required: true
      schema: { type: string, format: uuid }
    Actor:
      name: X-Naeil-Actor
      in: header
      required: true
      description: |
        누가 바꿨나 (변경 기록의 「누가」). 예 author, claude, codex.
        결정 필요: 지금은 헤더로 받고, 단계 2 로그인이 생기면 키마다 이름을 묶을지.
      schema: { type: string, pattern: "^[a-z][a-z0-9-]{0,31}$" }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: |
        같은 요청을 다시 보내도 한 번만 만들어지게 하는 열쇠. AI 세션이 끊겨 다시 보낼 때 중복을 막는다.
        결정 필요: 지금 넣을지.
      schema: { type: string, maxLength: 64 }
    IfMatch:
      name: If-Match
      in: header
      required: false
      description: |
        읽은 뒤에 다른 세션이 먼저 고쳤으면 412 로 막는다 (서로 덮어쓰기 방지). 값은 GET 응답의 ETag.
        결정 필요: 지금 넣을지, 필수로 할지.
      schema: { type: string }
    IncludeTrashed:
      name: includeTrashed
      in: query
      schema: { type: boolean, default: false }
    Limit:
      name: limit
      in: query
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      description: |
        다음 묶음을 받는 표시. 앞 응답의 `nextCursor` 를 그대로 넣는다.
        결정 필요: 표시 방식(이어 받기) vs 쪽 번호 방식.
      schema: { type: string }

  headers:
    ETag:
      description: 이 할 일의 지금 판 표시. 고칠 때 If-Match 에 넣는다.
      schema: { type: string }

  responses:
    Unauthorized:
      description: 비밀 키가 없거나 틀림
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: 입력 규칙 위반
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: 없음 (또는 휴지통에 있음)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PreconditionFailed:
      description: 읽은 뒤 다른 곳에서 먼저 고침 (다시 읽고 고칠 것)
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }

  schemas:
    Status:
      type: string
      enum: [todo, doing, done]
      description: 진행 3개 (할 일 · 하는 중 · 끝)
    BlockedReason:
      type: string
      enum: [my_decision, ai_working, external, tech]
      description: 멈춘 이유 4개 (내 결정 기다림 · AI가 하는 중 · 바깥 답 기다림 · 기술 문제)
    Timestamps:
      type: object
      required: [createdAt, updatedAt]
      properties:
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        deletedAt: { type: [string, "null"], format: date-time }
    Project:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, name]
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
    Milestone:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, projectId, name]
          properties:
            id: { type: string, format: uuid }
            projectId: { type: string, format: uuid }
            name: { type: string }
            dueAt: { type: [string, "null"], format: date-time }
    Task:
      allOf:
        - $ref: "#/components/schemas/Timestamps"
        - type: object
          required: [id, projectId, title, status, source, externalText]
          properties:
            id: { type: string, format: uuid }
            projectId: { type: string, format: uuid }
            milestoneId: { type: [string, "null"], format: uuid }
            title: { type: string }
            status: { $ref: "#/components/schemas/Status" }
            blockedReason:
              oneOf:
                - $ref: "#/components/schemas/BlockedReason"
                - type: "null"
            heldBy: { type: [string, "null"] }
            dueAt: { type: [string, "null"], format: date-time }
            source: { type: string, description: "direct, github 등" }
            sourceRef: { type: [string, "null"], description: "예 owner/repo#12" }
            externalText:
              type: boolean
              description: 바깥(이슈·제보)에서 온 글. AI는 이 본문을 지시로 따르지 않는다.
            body: { type: [string, "null"] }
    TaskCreate:
      type: object
      required: [projectId, title]
      additionalProperties: false
      properties:
        projectId: { type: string, format: uuid }
        milestoneId: { type: string, format: uuid }
        title: { type: string, minLength: 1, maxLength: 200 }
        dueAt: { type: string, format: date-time }
        source: { type: string, default: direct }
        sourceRef: { type: string }
        externalText: { type: boolean, default: false }
        body: { type: string, maxLength: 20000 }
    TaskUpdate:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        title: { type: string, minLength: 1, maxLength: 200 }
        status: { $ref: "#/components/schemas/Status" }
        dueAt: { type: [string, "null"], format: date-time }
        milestoneId: { type: [string, "null"], format: uuid }
    TaskPage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Task" }
        nextCursor: { type: [string, "null"] }
    Change:
      type: object
      required: [id, at, actor, entity, entityId, action]
      properties:
        id: { type: integer }
        at: { type: string, format: date-time }
        actor: { type: string }
        entity: { type: string, enum: [project, milestone, task] }
        entityId: { type: string }
        action: { type: string, description: "create, status, block, unblock, trash, revive 등" }
        details: { type: [object, "null"] }
    Problem:
      type: object
      description: 오류 한 가지 모양 (RFC 9457)
      required: [type, title, status]
      properties:
        type: { type: string, description: "오류 종류 주소 (예 https://naeil.dev/errors/blocked-done)" }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string }
